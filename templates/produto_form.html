{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>{{ "Editar produto" if produto else "Adicionar produto" }}</h1>

    <form method="POST">
        <label>Nome do produto</label>
        <input
            type="text"
            name="nome"
            value="{{ produto['nome'] if produto else '' }}"
            required
        >

        <label>Preço</label>
        <input
            type="number"
            step="0.01"
            name="preco"
            value="{{ produto['preco'] if produto else '' }}"
            required
        >

        <label>Estoque</label>
        <input
            type="number"
            name="estoque"
            value="{{ produto['estoque'] if produto else '' }}"
            required
        >

        <button type="submit">Salvar produto</button>
        <a href="{{ url_for('produtos') }}">Cancelar</a>
    </form>
</div>
{% endblock %}
