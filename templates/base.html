<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Depósito{% endblock %} — Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Depósito<span>.</span></div>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'ativo' if request.endpoint == 'index' else '' }}">Painel</a>
        <a href="{{ url_for('produtos') }}" class="{{ 'ativo' if request.endpoint and request.endpoint.startswith('produto') else '' }}">Produtos</a>
        <a href="{{ url_for('estoque') }}" class="{{ 'ativo' if request.endpoint == 'estoque' else '' }}">Estoque</a>
        <a href="{{ url_for('vendas') }}" class="{{ 'ativo' if request.endpoint == 'vendas' else '' }}">Vendas</a>
      </nav>
    </aside>
    <main>
      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
          {% for categoria, texto in mensagens %}
            <div class="flash {{ categoria }}">{{ texto }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block conteudo %}{% endblock %}
    </main>
  </div>
</body>
</html>
